services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5440:5432'
    volumes:
      - ./api/postgres_data:/var/lib/postgresql/data

  messaging-api:
    build: .
    container_name: messaging-api
    restart: unless-stopped
    command: sh -c "npx prisma db push && node dist/src/main"
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
