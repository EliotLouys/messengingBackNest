name: Format, lint, test and build

# Triggers on any Pull Request towards the main branch
on:
  pull_request:
    branches: [main]

jobs:
  # Runs the formatter and the linter
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint

  # Runs the test suites and creates a coverage report in the PR
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    # Spins up a PostgreSQL database for the tests to run against
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: tenropes
        ports:
          - 5432:5432
        # Ensures the DB is ready before the steps start
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/tenropes?schema=public
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate
      - name: Prisma Migrate
        run: npx prisma migrate dev --preview-feature # preview mode for testing
      - name: Run tests and collect coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        if: always()
        with:
          test-script: npm run test:cov
          custom-title: Backend coverage report

  # Runs build to ensure everything works
  build:
    needs: [format-and-lint, test]
    runs-on: ubuntu-latest
    # Spins up a PostgreSQL database for the build to run migrations against
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: tenropes
        ports:
          - 5432:5432
        # Ensures the DB is ready before the steps start
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/tenropes?schema=public
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prisma Migrate
        run: npx prisma migrate dev --preview-feature # preview mode for testing
      - name: Prisma Generate
        run: npx prisma generate
      - name: Build
        run: npm run build
