name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run format
      # - name: Commit linted files
      #   uses: stefanzweifel/git-auto-commit-action@v5
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run lint
  build:
    needs: [format, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prisma Migrate
        run: npx prisma migrate dev --preview-feature
        env:
          DATABASE_URL: file:./test.db
      - name: Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./test.db
